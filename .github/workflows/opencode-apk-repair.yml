name: OpenCode autonomous JARVIS developer

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: jarvis-autonomous-developer
  cancel-in-progress: false

jobs:
  develop:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run autonomous development agent
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/glm-5.3-flash-free
          use_github_token: true
          prompt: |
            You are the autonomous software engineering agent for Open Jarvis Android.
            Each invocation must make one bounded, evidence-based unit of progress. Do not
            merely report status. Start with open issue #3, the confirmed Android 13 runtime
            crash after the purple splash screen. Read the issue, inspect source ZIP,
            workflow patches, previous build logs and available artifacts. Diagnose the
            root cause, implement a real source-level fix, add or improve tests, and run
            the strongest feasible validation (Gradle assembleDebug and emulator smoke test
            if an emulator is available). Preserve every existing Android permission,
            accessibility capability, service, Turkish localization and app behavior.
            Never remove or weaken permissions. Do not fake tests, suppress errors, or claim
            physical-device validation when only CI was used.

            If issue #3 is fully addressed with evidence, select the next highest-priority
            open issue or a clearly documented missing feature from the repository backlog.
            Work on only one coherent task per invocation. Update documentation and the
            relevant GitHub issue with exact changes, test commands, outcomes and remaining
            limitations.

            SAFETY AND RELEASE RULES:
            - Never push directly to main.
            - Create a descriptive branch and open or update a pull request.
            - Do not merge pull requests, publish releases, alter repository secrets,
              change billing, or deploy externally.
            - Do not expose API keys, tokens, signing credentials or private data.
            - Do not modify unrelated projects.
            - If credentials, device access, or missing evidence block progress, explain
              the precise blocker in the issue and stop rather than guessing.
            - Do not claim the APK works on a physical phone without actual device evidence.
            - Prefer small, reviewable changes and avoid repeating an unchanged failed attempt.

            This workflow runs periodically in GitHub-hosted cloud runners; each run is
            time-limited and independent. Leave a clear handoff in the issue/PR so the next
            scheduled run can continue from verified progress.
