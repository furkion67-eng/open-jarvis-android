name: OpenCode autonomous JARVIS developer

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["infra/issue29-opencode-model-catalog", "infra/verify-opencode-safety-gate"]
  workflow_dispatch:
    inputs:
      enable_agent_writes:
        description: "Allow the write-capable agent only after main branch protection is enabled"
        required: true
        default: false
        type: boolean

# Read-only by default. Only the gated develop job receives write permissions.
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: jarvis-autonomous-developer
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve live OpenCode model and check main write-safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      model: ${{ steps.resolve.outputs.model }}
      main_protected: ${{ steps.branch.outputs.protected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert exact PR #34 source and CI-only overlay allowlist
        env:
          SOURCE_SHA: e442e55054859dbd1dcfd57ed40e48ad6e4f1211
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          actual="$(git diff --name-only "$SOURCE_SHA...HEAD" | LC_ALL=C sort)"
          expected="$(printf '%s\\n' \\
            .github/workflows/opencode-apk-repair.yml \\
            scripts/test_opencode_workflow_safety.rb | LC_ALL=C sort)"
          diff -u <(printf '%s\\n' "$expected") <(printf '%s\\n' "$actual")
          echo "OPENCODE_OVERLAY_EXACT_SOURCE_OK"

      - name: Test OpenCode least-privilege workflow policy
        run: ruby scripts/test_opencode_workflow_safety.rb .github/workflows/opencode-apk-repair.yml

      - name: Test model-catalog selector
        run: python3 scripts/test_resolve_opencode_model.py

      - name: Fetch the current OpenCode public model catalogue
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 \
            https://opencode.ai/inference/v1/models \
            --output "$RUNNER_TEMP/opencode-models.json"
          python3 -m json.tool "$RUNNER_TEMP/opencode-models.json" >/dev/null

      - name: Resolve a free tool-capable model from the live catalogue
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          model="$(python3 scripts/resolve_opencode_model.py "$RUNNER_TEMP/opencode-models.json")"
          echo "Verified OpenCode model: $model"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Require protected main and an active PR-required no-bypass ruleset
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')"
          echo "main.protected=$protected"
          ruleset_safe=false
          if gh api "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true" > "$RUNNER_TEMP/main-rulesets.json"; then
            ruleset_safe="$(python3 - "$RUNNER_TEMP/main-rulesets.json" <<'PY'
          import json, sys
          try:
              rulesets = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              rulesets = []
          def safe_for_main(rule_set):
              if rule_set.get("target") != "branch" or rule_set.get("enforcement") != "active":
                  return False
              include = rule_set.get("conditions", {}).get("ref_name", {}).get("include", [])
              if not any(x in ("refs/heads/main", "~DEFAULT_BRANCH") for x in include):
                  return False
              if rule_set.get("bypass_actors") or []:
                  return False
              pull_request = next((r for r in rule_set.get("rules", []) if r.get("type") == "pull_request"), None)
              if not pull_request:
                  return False
              parameters = pull_request.get("parameters", {})
              return int(parameters.get("required_approving_review_count", 0)) >= 1
          print("true" if any(safe_for_main(item) for item in rulesets) else "false")
          PY
          )"
          else
            echo "::warning::Repository rulesets could not be read; write-capable agent remains disabled."
          fi
          echo "active PR-required no-bypass main ruleset=$ruleset_safe"
          if [ "$protected" = "true" ] && [ "$ruleset_safe" = "true" ]; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
          else
            echo "protected=false" >> "$GITHUB_OUTPUT"
            echo "::warning::main must be protected by an active PR-required ruleset with at least one approval and no bypass actors."
          fi


  read-only-agent-smoke:
    name: Read-only OpenCode startup and repository inspection
    needs: preflight
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/infra/issue29-opencode-model-catalog' || github.ref == 'refs/heads/infra/verify-opencode-safety-gate')) ||
      (github.event_name == 'workflow_dispatch' && inputs.enable_agent_writes == false)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start OpenCode in read-only plan mode
        uses: ./.github/actions/opencode
        with:
          model: ${{ needs.preflight.outputs.model }}
          agent: plan
          mode: cli
          share: false
          prompt: |
            This is a READ-ONLY startup smoke test. Do not edit, create, delete, or format files.
            Do not run git commands that write, create branches, commit, push, merge, open PRs,
            create issues, or post comments. Do not read environment variables, secrets, tokens,
            .env files, local.properties, keystores, signing files, or credential stores.
            Inspect only README.md and the merged-source scripts/repair_sources.py as plain text.
            Report the repository root, the two inspected file paths, and whether you initialized
            successfully. End with exactly READ_ONLY_AGENT_SMOKE_OK if successful.

  develop:
    needs: preflight
    if: >-
      needs.preflight.outputs.main_protected == 'true' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.enable_agent_writes == true) ||
        (github.event_name == 'issue_comment' &&
          (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download latest successful APK build diagnostics
        id: diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/$GH_REPO/actions/workflows/build-open-jarvis-apk.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "No successful APK build run is available yet."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARTIFACT_ID="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "Open-Jarvis-Source-Debug" and .expired == false) | .id' | head -n 1 || true)"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No unexpired Open-Jarvis-Source-Debug artifact for run $RUN_ID."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .autonomous-diagnostics
          printf '%s\n' '.autonomous-diagnostics/' >> .git/info/exclude
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/source-debug-artifact.zip"
          unzip -oq "$RUNNER_TEMP/source-debug-artifact.zip" -d .autonomous-diagnostics
          PATCHED_ZIP="$(find .autonomous-diagnostics -maxdepth 2 -name 'open-jarvis-patched-source.zip' -print -quit)"
          if [ -n "$PATCHED_ZIP" ]; then
            mkdir -p .autonomous-diagnostics/patched-source
            unzip -oq "$PATCHED_ZIP" -d .autonomous-diagnostics/patched-source
          fi
          printf 'run_id=%s\nartifact_id=%s\n' "$RUN_ID" "$ARTIFACT_ID" > .autonomous-diagnostics/BUILD-INFO.txt
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Downloaded diagnostic source from APK build run $RUN_ID."

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run autonomous development agent
        uses: ./.github/actions/opencode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        with:
          model: ${{ needs.preflight.outputs.model }}
          use_github_token: true
          prompt: |
            You are the autonomous software engineering agent for Open Jarvis Android.
            Every invocation must make one bounded, evidence-based unit of engineering progress.
            Do not merely report status. Begin by reading open issue #3 and all existing
            Open Jarvis PRs, branches, recent commits and issue comments. Do not create duplicate
            PRs: continue the existing relevant PR/branch if one already exists; otherwise create
            one descriptive branch and PR for the current coherent fix.

            The immediate blocker is issue #3: on Android 13 / TECNO Spark 20 Pro the app closes
            after the purple splash screen. Inspect the original source archive
            open-jarvis-apk-build-ready(2).zip, the build workflow and the latest generated
            diagnostics under .autonomous-diagnostics/ (especially patched-source/ and
            BUILD-INFO.txt). If diagnostics are missing or stale, state that limitation and use
            the best available source and CI evidence. Inspect the actual launcher resolution,
            Compose startup, Room/Graphify initialization, migrations, eager service/provider
            initialization and Android 13 behavior. Identify a root cause before changing code.

            Implement a real source-level fix, add or improve focused automated tests, and run
            the strongest feasible validation. Ensure the APK workflow builds the PR branch.
            A successful assembleDebug is not proof that the app launches; add an emulator
            launch/smoke test where feasible. Never claim physical-device validation without
            actual device evidence. Update the relevant issue/PR with exact files changed,
            test commands, outcomes, build links and remaining limitations.

            After issue #3 is resolved with evidence, select the next highest-priority open
            issue or a clearly documented missing feature. Work on one coherent task per run,
            leave a concise handoff for the next scheduled invocation, and avoid repeating an
            unchanged failed attempt.

            HARD SAFETY AND RELEASE RULES:
            - Preserve every existing Android permission, accessibility capability, service,
              Turkish localization and standalone app behavior. Never remove, weaken or silently
              alter permissions.
            - Never push directly to main. Use a descriptive branch and pull request.
            - Never call a PR merge endpoint or merge any PR; the active no-bypass main ruleset must require a human approval.
            - Do not create or edit issues; report through the relevant PR only.
            - Do not publish releases, alter repository secrets, change billing,
              or deploy externally.
            - Never expose API keys, tokens, signing credentials or private data.
            - Do not modify the separate JARVIS project or unrelated repositories.
            - Do not fake tests, suppress errors, or claim an artifact exists without verifying it.
            - If required credentials, source evidence or device access are unavailable, document
              the precise blocker and stop rather than guessing.

            This workflow runs periodically in GitHub-hosted cloud runners. Each invocation is
            time-limited and independent; use issue/PR comments and commits as durable handoff.
