name: Open Jarvis build result notification

on:
  workflow_run:
    workflows: ["Build Open Jarvis APK"]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  notify:
    if: github.event.workflow_run.conclusion != ''
    runs-on: ubuntu-latest
    steps:
      - name: Report build result on the related pull request
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length === 0) {
              core.info("This workflow run is not linked to a pull request; no PR comment was posted.");
              return;
            }
            const status = run.conclusion === "success" ? "BAŞARILI" : "BAŞARISIZ";
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            const body = [
              `## Open Jarvis APK derleme sonucu: ${status}`,
              "",
              `- Dal: \`${run.head_branch}\``,
              `- Commit: \`${run.head_sha.slice(0, 7)}\``,
              `- Sonuç: \`${run.conclusion}\``,
              `- [Derleme ayrıntıları ve APK artifact'ları](${artifactUrl})`,
              "",
              "Bu mesaj GitHub Actions tarafından otomatik oluşturuldu."
            ].join("\\n");
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }
