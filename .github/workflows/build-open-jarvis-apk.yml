name: Build Open Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [ main, "feature/approval-toggle", "feature/repair-overlay-input-digest-2026-11-21", "infra/ci-device-guardrails-a698-20261121", "infra/ci-voice-sms-dispatch-unification-20261121", "infra/ci-contact-first-voice-sms-20261121", "infra/ci-contact-first-voice-sms-5c17-20261122", "infra/ci-contact-first-voice-sms-33894-20261122", "infra/ci-integrated-shorts-player-6ad015-20261122", "infra/ci-integrated-device-shorts-6a9d-20261122", "infra/ci-integrated-device-shorts-5e6291-20261122" ]
  pull_request:
    branches: [ main, "feature/device-integration-guardrails-2026-11-21", "feature/voice-sms-dispatch-unification-20261121", "feature/contact-first-voice-sms-routing-20261121", "feature/player-bounded-captions-20261122", "feature/call-permission-status-revocation-20261122", "feature/saf-read-bounded-revalidation-20261122" ]

permissions:
  contents: read

concurrency:
  group: open-jarvis-apk-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact pushed commit
        if: github.event_name == 'push'
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Assert exact Feature source parent for infrastructure validation
        if: github.event_name == 'push'
        env:
          EXPECTED_FEATURE_SHA: 5e6291d05fecc3b38148e07835ee913740dfa288
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_SHA"

      - name: Assert exact pull-request head and base
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_FEATURE_SHA: 5e6291d05fecc3b38148e07835ee913740dfa288
        run: |
          test "$EXPECTED_BASE" = "$EXPECTED_FEATURE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_SHA"
          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"

      - name: Extract source and locate project
        id: source
        run: |
          unzip -q "open-jarvis-apk-build-ready(2).zip" -d source
          SETTINGS_FILE="$(find source -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -d "$PROJECT_DIR/app"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"
          # Fix the launcher component: MainActivity is in com.openjarvis.ui,
          # while the Gradle namespace/applicationId is com.openjarvis.
          python3 - "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('android:name=".MainActivity"', 'android:name=".ui.MainActivity"')
          s = s.replace('android:parentActivityName=".MainActivity"', 'android:parentActivityName=".ui.MainActivity"')
          p.write_text(s)
          PY
          python3 scripts/repair_sources.py "$PROJECT_DIR"
          # Avoid constructing AgentCore during launcher startup: it eagerly opens
          # encrypted provider preferences and is not used by MainActivity's dashboard.
          python3 - "$PROJECT_DIR/app/src/main/java/com/openjarvis/ui/MainActivity.kt" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('import com.openjarvis.agent.AgentCore\n', '')
          s = s.replace('import com.openjarvis.agent.AgentState\n', '')
          s = s.replace('    private lateinit var agentCore: AgentCore\n', '')
          s = s.replace('        agentCore = AgentCore(this)\n', '')
          s = s.replace('                val agentState by agentCore.state.collectAsState()\n', '')
          # Defer Room repository construction into a guarded Compose state.
          # A database initialization exception must not terminate MainActivity.
          s = s.replace('    private lateinit var graphifyRepo: GraphifyRepository\n', '')
          s = s.replace('        graphifyRepo = GraphifyRepository(this)\n', '')
          s = s.replace(
              '                val context = LocalContext.current\n',
              '                val context = LocalContext.current\n                val graphifyRepoResult = remember { runCatching { GraphifyRepository(applicationContext) } }\n'
          )
          s = s.replace(
              '                        graphifyRepo = graphifyRepo,\n',
              '                        graphifyRepo = graphifyRepoResult.getOrThrow(),\n'
          )
          # If repository creation fails, show a recoverable diagnostic screen.
          s = s.replace(
              '                } else {\n                    DashboardScreen(',
              '''                } else if (graphifyRepoResult.isFailure) {
                      androidx.compose.material3.Surface(modifier = Modifier.fillMaxSize()) {
                          androidx.compose.material3.Text(
                              text = "Open Jarvis could not initialize local storage.\\n" +
                                  (graphifyRepoResult.exceptionOrNull()?.message ?: "Unknown startup error"),
                              modifier = Modifier.padding(24.dp)
                          )
                      }
                  } else {
                      DashboardScreen('''
          )
          p.write_text(s)
          # Keep the launcher/dashboard alive if the local Room database cannot
          # be opened (for example, an older on-device schema or corrupt DB).
          dashboard = p.parent / "dashboard" / "DashboardScreen.kt"
          ds = dashboard.read_text()
          ds = ds.replace(
              "        recentTasks = graphifyRepo.getRecentTasks(10)\\n        mostUsedApps = graphifyRepo.getMostUsedApps(4)",
              """        try {
                  recentTasks = graphifyRepo.getRecentTasks(10)
                  mostUsedApps = graphifyRepo.getMostUsedApps(4)
              } catch (e: Exception) {
                  android.util.Log.e("OpenJarvis", "Dashboard database load failed", e)
                  recentTasks = emptyList()
                  mostUsedApps = emptyList()
              }"""
          )
          dashboard.write_text(ds)
          PY
          python3 scripts/add_startup_diagnostics.py "$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Audit declared Android permissions (no permission changes)
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'app/src/main/AndroidManifest.xml'
          root = ET.parse(p).getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          print('===== Declared permissions (preserved as approved) =====')
          for node in root.findall('uses-permission'):
              print(node.get(ns + 'name'))
          print('===== Services and protection =====')
          for node in root.findall('./application/service'):
              print(node.get(ns + 'name'), 'permission=', node.get(ns + 'permission'))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Enable AndroidX
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          touch gradle.properties
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          cat gradle.properties

      - name: Capture failing Kotlin source context
        if: always()
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          echo "===== AgentCore.kt ====="
          sed -n '285,330p' app/src/main/java/com/openjarvis/agent/AgentCore.kt || true
          echo "===== MCPClient.kt ====="
          sed -n '1,155p' app/src/main/java/com/openjarvis/mcp/MCPClient.kt || true
          echo "===== AutomationManager.kt ====="
          sed -n '180,235p' app/src/main/java/com/openjarvis/automation/AutomationManager.kt || true
          echo "===== AutomationDB.kt ====="
          sed -n '1,100p' app/src/main/java/com/openjarvis/automation/AutomationDB.kt || true
          echo "===== TaskNodeDao.kt ====="
          sed -n '1,80p' app/src/main/java/com/openjarvis/graphify/nodes/TaskNodeDao.kt || true

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: gradle --no-daemon --max-workers=1 --stacktrace assembleDebug

      - name: Verify Debug APK signature, package metadata and checksum
        id: verify_apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > app/build/outputs/apk/debug/apk-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Build instrumented test APK
        id: build_test_apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: gradle --no-daemon --max-workers=1 --stacktrace assembleDebugAndroidTest

      - name: Run Debug and Release JVM tests
        if: always()
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: gradle --no-daemon --max-workers=1 --stacktrace testDebugUnitTest testReleaseUnitTest

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Unit-Test-Results
          path: ${{ steps.source.outputs.project_dir }}/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload instrumented test APK
        if: always() && steps.build_test_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Test-APK
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Package patched source for diagnostics
        if: always()
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          zip -qr "$GITHUB_WORKSPACE/open-jarvis-patched-source.zip" . -x '*/build/*' '*/.gradle/*'

      - name: Upload patched source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Source-Debug
          path: open-jarvis-patched-source.zip
          if-no-files-found: warn
          retention-days: 2

      - name: Upload APK
        if: always() && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-APK
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    name: Emulator launch and instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download app APK
        uses: actions/download-artifact@v4
        with:
          name: Open-Jarvis-APK
          path: apk

      - name: Download instrumented test APK
        uses: actions/download-artifact@v4
        with:
          name: Open-Jarvis-Test-APK
          path: apk-tests

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Ensure sqlite3 is available
        run: |
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y sqlite3
          fi
          sqlite3 --version

      - name: Boot Android 13 emulator and run launch smoke scenarios
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_APK: apk/app-debug.apk
          TEST_APK: apk-tests/app-debug-androidTest.apk
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: bash scripts/smoke_test.sh

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Smoke-Test-API-${{ matrix.api-level }}
          path: |
            screen-*.png
            crashlog.txt
            logcat-full.txt
            instrumented.log
            databases.txt
          if-no-files-found: warn
          retention-days: 7

