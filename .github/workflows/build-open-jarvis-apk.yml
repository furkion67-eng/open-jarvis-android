name: Build Open Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source and locate project
        id: source
        run: |
          unzip -q "open-jarvis-apk-build-ready(2).zip" -d source
          find source -maxdepth 4 -name settings.gradle -o -name settings.gradle.kts
          PROJECT_DIR="$(dirname "$(find source -maxdepth 4 -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          test -n "$PROJECT_DIR"
          test -d "$PROJECT_DIR/app"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Inspect Android Gradle Plugin version
        run: |
          grep -R -n "com.android.tools.build:gradle\|com.android.application.*version" source --include='*.gradle' --include='*.gradle.kts' || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-APK
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
