name: Build Open Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [ main, "feature/approval-toggle", "integration/turkish-stt-rebased-main", "integration/task-engine-rebased-main", "infra/issue15-node24-mainline", "infra/issue8-video-ci-validation", "infra/issue8-video-ci-validation-current", "infra/issue8-video-ci-validation-latest", "infra/verify-pr31-tts-exact", "infra/verify-pr31-tts-exact-3dc58e6", "infra/verify-pr32-app-launch-exact-952a", "infra/verify-pr32-app-launch-exact-d465", "infra/verify-pr52-video-storyboard-exact-ef9e507", "infra/verify-pr52-video-storyboard-exact-084f209", "infra/verify-pr59-video-procedural-exact-605226c", "infra/verify-pr97-device-host-player-f4a911b-20261120", "infra/verify-combined-jarvis-20261120", "infra/verify-combined-jarvis-progress-20261120", "infra/verify-jarvis-top-stack-20261120", "infra/verify-jarvis-room7-stack-20261120", "infra/verify-jarvis-stack-ca9629-20261120", "infra/verify-jarvis-stack-6b321-20261121" ]
  pull_request:
    branches: [ main, "integration/turkish-stt-rebased-main", "integration/task-engine-rebased-main", "feature/issue8-local-mp4-prototype", "feature/video-storyboard-captions-2026-11-19", "feature/video-procedural-scenes-2026-11-19", "feature/device-host-player-persistence-2026-11-20", "feature/shorts-provenance-hardening-2026-11-20", "feature/truthful-task-progress-2026-11-20", "feature/shorts-export-contract-assertions-2026-11-20", "feature/sms-room-outcome-journal-2026-11-20", "feature/debug-player-host-manifest-2026-11-20", "feature/fix-debug-manifest-idempotence-2026-11-21", "feature/player-preparing-buffer-state-2026-11-21" ]

permissions:
  contents: read

concurrency:
  group: open-jarvis-apk-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assert exact commit on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected exact push SHA: $GITHUB_SHA"
          echo "Checked out SHA: $actual"
          test "$actual" = "$GITHUB_SHA"

      - name: "Assert exact combined PR #97/#100/#101/#103/#105/#106/#107/#109/#110/#112/#113/#114/#116/#118 source and eight-path CI overlay"
        shell: bash
        env:
          EXPECTED_FEATURE_SOURCE_SHA: 6b321bc9e250251a8ec1f89cc454162ebff5d1fe
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_FEATURE_SOURCE_SHA" <<'PY'
          import subprocess, sys
          source = sys.argv[1]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          parents = subprocess.check_output(["git", "show", "-s", "--format=%P", "HEAD"], text=True).strip()
          print(f"EXPECTED_FEATURE_SOURCE_SHA: {source}")
          print(f"CHECKED_OUT_OVERLAY_SHA: {head}")
          print(f"OVERLAY_PARENT_SHAS: {parents}")
          subprocess.run(["git", "cat-file", "-e", f"{source}^{{commit}}"], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", source, head], check=True)
          expected = sorted([
              ".github/workflows/build-open-jarvis-apk.yml",
              "features/task-engine/app/src/androidTest/java/com/openjarvis/tasks/MainActivityLaunchInstrumentedTest.kt",
              "features/video-mvp/app/src/androidTest/java/com/openjarvis/video/VideoStoryPipelineInstrumentedTest.kt",
              "scripts/launcher_visibility_check.sh",
              "scripts/smoke_test.sh",
              "scripts/test_launcher_visibility_check.sh",
              "scripts/test_video_artifact_contract.py",
              "scripts/validate_video_artifact.py",
          ])
          actual = sorted(subprocess.check_output(["git", "diff", "--name-only", f"{source}...HEAD"], text=True).splitlines())
          print("ACTUAL_CI_OVERLAY_PATHS:")
          print("\\n".join(actual))
          if actual != expected:
              print("EXPECTED_CI_OVERLAY_PATHS:")
              print("\\n".join(expected))
              raise SystemExit("CI overlay changed paths outside the complete eight-file allowlist")
          print(f"FEATURE_SOURCE_EXACT_OK: {source} is an ancestor; exact eight-file allowlist")
          PY

      - name: Extract source and locate project
        id: source
        run: |
          unzip -q "open-jarvis-apk-build-ready(2).zip" -d source
          SETTINGS_FILE="$(find source -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -d "$PROJECT_DIR/app"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"
          # Fix the launcher component: MainActivity is in com.openjarvis.ui,
          # while the Gradle namespace/applicationId is com.openjarvis.
          python3 - "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('android:name=".MainActivity"', 'android:name=".ui.MainActivity"')
          s = s.replace('android:parentActivityName=".MainActivity"', 'android:parentActivityName=".ui.MainActivity"')
          p.write_text(s)
          PY
          python3 scripts/repair_sources.py "$PROJECT_DIR"
          python3 -m py_compile scripts/repair_sources.py
          python3 - "$PROJECT_DIR" "$RUNNER_TEMP/repair-first.sha256" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          scope = [
              "app/src/main/java/com/openjarvis/deviceaccess",
              "app/src/test/java/com/openjarvis/deviceaccess",
              "app/src/main/java/com/openjarvis/deviceactions",
              "app/src/test/java/com/openjarvis/deviceactions",
              "app/src/androidTest/java/com/openjarvis/deviceactions",
              "app/src/main/java/com/openjarvis/ui/player",
              "app/src/androidTest/java/com/openjarvis/ui/player",
              "app/src/main/java/com/openjarvis/tasks",
              "app/src/test/java/com/openjarvis/tasks",
              "app/src/androidTest/java/com/openjarvis/tasks",
              "app/src/main/java/com/openjarvis/ui/dashboard/DashboardScreen.kt",
              "app/src/main/java/com/openjarvis/ui/dashboard/VideoMvpPanel.kt",
              "app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt",
              "app/build.gradle",
          ]
          selected = []
          for relative in scope:
              target = root / relative
              if target.is_dir():
                  selected.extend(p for p in target.rglob("*") if p.is_file())
              elif target.is_file():
                  selected.append(target)
          rows = []
          for path in sorted(set(selected)):
              rel = path.relative_to(root).as_posix()
              rows.append(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + rel)
          out.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          python3 scripts/repair_sources.py "$PROJECT_DIR"
          python3 - "$PROJECT_DIR" "$RUNNER_TEMP/repair-second.sha256" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          scope = [
              "app/src/main/java/com/openjarvis/deviceaccess",
              "app/src/test/java/com/openjarvis/deviceaccess",
              "app/src/main/java/com/openjarvis/deviceactions",
              "app/src/test/java/com/openjarvis/deviceactions",
              "app/src/androidTest/java/com/openjarvis/deviceactions",
              "app/src/main/java/com/openjarvis/ui/player",
              "app/src/androidTest/java/com/openjarvis/ui/player",
              "app/src/main/java/com/openjarvis/tasks",
              "app/src/test/java/com/openjarvis/tasks",
              "app/src/androidTest/java/com/openjarvis/tasks",
              "app/src/main/java/com/openjarvis/ui/dashboard/DashboardScreen.kt",
              "app/src/main/java/com/openjarvis/ui/dashboard/VideoMvpPanel.kt",
              "app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt",
              "app/build.gradle",
          ]
          selected = []
          for relative in scope:
              target = root / relative
              if target.is_dir():
                  selected.extend(p for p in target.rglob("*") if p.is_file())
              elif target.is_file():
                  selected.append(target)
          rows = []
          for path in sorted(set(selected)):
              rel = path.relative_to(root).as_posix()
              rows.append(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + rel)
          out.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          diff -u "$RUNNER_TEMP/repair-first.sha256" "$RUNNER_TEMP/repair-second.sha256"
          echo "REPAIR_SOURCES_IDEMPOTENT_OK: two consecutive repairs are byte-identical"
          # Avoid constructing AgentCore during launcher startup: it eagerly opens
          # encrypted provider preferences and is not used by MainActivity's dashboard.
          python3 - "$PROJECT_DIR/app/src/main/java/com/openjarvis/ui/MainActivity.kt" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('import com.openjarvis.agent.AgentCore\n', '')
          s = s.replace('import com.openjarvis.agent.AgentState\n', '')
          s = s.replace('    private lateinit var agentCore: AgentCore\n', '')
          s = s.replace('        agentCore = AgentCore(this)\n', '')
          s = s.replace('                val agentState by agentCore.state.collectAsState()\n', '')
          # Defer Room repository construction into a guarded Compose state.
          # A database initialization exception must not terminate MainActivity.
          s = s.replace('    private lateinit var graphifyRepo: GraphifyRepository\n', '')
          s = s.replace('        graphifyRepo = GraphifyRepository(this)\n', '')
          s = s.replace(
              '                val context = LocalContext.current\n',
              '                val context = LocalContext.current\n                val graphifyRepoResult = remember { runCatching { GraphifyRepository(applicationContext) } }\n'
          )
          s = s.replace(
              '                        graphifyRepo = graphifyRepo,\n',
              '                        graphifyRepo = graphifyRepoResult.getOrThrow(),\n'
          )
          # If repository creation fails, show a recoverable diagnostic screen.
          s = s.replace(
              '                } else {\n                    DashboardScreen(',
              '''                } else if (graphifyRepoResult.isFailure) {
                      androidx.compose.material3.Surface(modifier = Modifier.fillMaxSize()) {
                          androidx.compose.material3.Text(
                              text = "Open Jarvis could not initialize local storage.\\n" +
                                  (graphifyRepoResult.exceptionOrNull()?.message ?: "Unknown startup error"),
                              modifier = Modifier.padding(24.dp)
                          )
                      }
                  } else {
                      DashboardScreen('''
          )
          p.write_text(s)
          # Keep the launcher/dashboard alive if the local Room database cannot
          # be opened (for example, an older on-device schema or corrupt DB).
          dashboard = p.parent / "dashboard" / "DashboardScreen.kt"
          ds = dashboard.read_text()
          ds = ds.replace(
              "        recentTasks = graphifyRepo.getRecentTasks(10)\\n        mostUsedApps = graphifyRepo.getMostUsedApps(4)",
              """        try {
                  recentTasks = graphifyRepo.getRecentTasks(10)
                  mostUsedApps = graphifyRepo.getMostUsedApps(4)
              } catch (e: Exception) {
                  android.util.Log.e("OpenJarvis", "Dashboard database load failed", e)
                  recentTasks = emptyList()
                  mostUsedApps = emptyList()
              }"""
          )
          dashboard.write_text(ds)
          PY
          python3 scripts/add_startup_diagnostics.py "$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Assert PR #97/#109/#110/#112/#113/#114 device, SMS, storage, debug player host and persistent player integration
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            app/src/main/java/com/openjarvis/deviceaccess/capabilities/DeviceCapabilityStatusPanel.kt \
            app/src/main/java/com/openjarvis/deviceaccess/storage/StorageAccessPanel.kt \
            app/src/main/java/com/openjarvis/deviceactions/ui/SmsComposePanel.kt \
            app/src/main/java/com/openjarvis/ui/player/VideoArtifactPlayerPanel.kt \
            app/src/main/java/com/openjarvis/ui/player/DashboardPlayerTestActivity.kt \
            app/src/androidTest/java/com/openjarvis/deviceactions/contacts/ContactResolutionInstrumentedTest.kt \
            app/src/androidTest/java/com/openjarvis/deviceactions/sms/SmsConfirmationInstrumentedTest.kt \
            app/src/androidTest/java/com/openjarvis/tasks/VideoArtifactMetadataCodecInstrumentedTest.kt \
            app/src/androidTest/java/com/openjarvis/tasks/VideoArtifactPersistenceInstrumentedTest.kt \
            app/src/androidTest/java/com/openjarvis/tasks/VideoTaskExecutionInstrumentedTest.kt \
            app/src/androidTest/java/com/openjarvis/ui/player/VideoArtifactPlayerInstrumentedTest.kt \
            app/src/main/java/com/openjarvis/tasks/DeviceActionEventEntity.kt \
            app/src/main/java/com/openjarvis/tasks/DeviceActionOutcomeJournal.kt \
            app/src/test/java/com/openjarvis/deviceaccess/storage/StorageMutationPolicyTest.kt \
            app/src/test/java/com/openjarvis/deviceactions/contacts/ContactResolutionTest.kt \
            app/src/test/java/com/openjarvis/deviceactions/sms/SmsActionContractTest.kt; do
            test -f "$path" || { echo "::error::Missing repaired host source: $path"; exit 1; }
          done
          grep -Fq 'VideoArtifactPlayerPanel(modifier = Modifier.fillMaxWidth())' app/src/main/java/com/openjarvis/ui/dashboard/DashboardScreen.kt
          test -f app/src/debug/AndroidManifest.xml
          grep -Fq 'DashboardPlayerTestActivity' app/src/debug/AndroidManifest.xml
          grep -Fq 'android:exported="false"' app/src/debug/AndroidManifest.xml
          if grep -Fq 'DashboardPlayerTestActivity' app/src/main/AndroidManifest.xml; then echo '::error::Debug-only player host leaked into the production manifest'; exit 1; fi
          if [ -f app/src/androidTest/AndroidManifest.xml ] && grep -Fq 'DashboardPlayerTestActivity' app/src/androidTest/AndroidManifest.xml; then echo '::error::Debug-only player host leaked into the instrumentation manifest'; exit 1; fi
          grep -Fq 'DeviceActionOutcomeJournal.record' app/src/main/java/com/openjarvis/deviceactions/ui/SmsComposePanel.kt
          grep -Fq 'DeviceCapabilityStatusPanel(modifier = Modifier.fillMaxWidth())' app/src/main/java/com/openjarvis/ui/dashboard/DashboardScreen.kt
          grep -Fq 'StorageAccessPanel(modifier = Modifier.fillMaxWidth())' app/src/main/java/com/openjarvis/ui/dashboard/DashboardScreen.kt
          grep -Fq 'SmsComposePanel(modifier = Modifier.fillMaxWidth())' app/src/main/java/com/openjarvis/ui/dashboard/DashboardScreen.kt
          grep -Fq 'videoUri TEXT' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'captionsUri TEXT' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'videoArtifactMetadataJson TEXT' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'val MIGRATION_5_6' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'androidx.activity:activity-compose' app/build.gradle
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          permissions = {node.get(ns + "name") for node in root.findall("uses-permission")}
          from collections import Counter
          counts = Counter(node.get(ns + "name") for node in root.findall("uses-permission"))
          required = {"android.permission.READ_CONTACTS", "android.permission.SEND_SMS"}
          missing = sorted(permission for permission in required if counts[permission] != 1)
          if missing:
              raise SystemExit("Host manifest must contain each device permission exactly once: " + ", ".join(missing))
          print("PR97-HOST-DEVICE-PLAYER-INTEGRATION-OK")
          PY

      - name: Assert storyboard pipeline and CI-only instrumentation are installed
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          test -f app/src/main/java/com/openjarvis/video/VideoStoryPipeline.kt
          test -f app/src/main/java/com/openjarvis/video/VideoStoryPlan.kt
          test -f app/src/main/java/com/openjarvis/video/VideoNarrationComposer.kt
          test -f app/src/androidTest/java/com/openjarvis/video/VideoStoryPipelineInstrumentedTest.kt
          test -f app/src/androidTest/java/com/openjarvis/video/VideoNarratedExportInstrumentedTest.kt
          echo "VIDEO-NARRATED-SOURCE-OK"

      - name: Assert Turkish CREATE_VIDEO routing and task recovery sources are installed
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/openjarvis/video/VideoCommandRouter.kt
          test -f app/src/main/java/com/openjarvis/tasks/VideoTaskIntegration.kt
          test -f app/src/main/java/com/openjarvis/tasks/JarvisTaskOrchestrator.kt
          test -f app/src/main/java/com/openjarvis/tasks/JarvisTaskRepository.kt
          test -f app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt
          test -f app/src/androidTest/java/com/openjarvis/tasks/VideoTaskExecutionInstrumentedTest.kt
          test -f app/src/androidTest/java/com/openjarvis/tasks/JarvisTaskPersistenceInstrumentedTest.kt
          test -f app/src/androidTest/java/com/openjarvis/ui/dashboard/TaskControlCenterReviewStateInstrumentedTest.kt
          test -f app/src/test/java/com/openjarvis/video/VideoCommandRouterTest.kt
          test -f app/src/test/java/com/openjarvis/ui/dashboard/TaskControlCenterReviewStateTest.kt
          test -f app/src/test/java/com/openjarvis/tasks/VideoTaskArtifactKeyTest.kt
          grep -Fq 'submitVideoCommandIfMatched(text, VideoCommandOrigin.TYPED' app/src/main/java/com/openjarvis/ui/VoiceCommandActivity.kt
          grep -Fq 'submitVideoCommandIfMatched(text, VideoCommandOrigin.RECOGNIZED_SPEECH' app/src/main/java/com/openjarvis/ui/VoiceCommandActivity.kt
          grep -Fq 'VideoCommandRouter.requestIdempotencyKey(topic, System.currentTimeMillis())' app/src/main/java/com/openjarvis/ui/VoiceCommandActivity.kt
          grep -Fq 'VideoStoryPipeline(appContext).render(topic, artifactKey = artifactKey)' app/src/main/java/com/openjarvis/tasks/VideoTaskIntegration.kt
          grep -Fq 'EXECUTOR_NOT_CONFIGURED' app/src/main/java/com/openjarvis/tasks/JarvisTaskOrchestrator.kt
          grep -Fq 'progressPercent = 0' app/src/main/java/com/openjarvis/tasks/JarvisTaskOrchestrator.kt
          grep -Fq 'APP_RESTARTED' app/src/main/java/com/openjarvis/tasks/JarvisTaskRepository.kt
          grep -Fq 'markInterruptedIfCurrent' app/src/main/java/com/openjarvis/tasks/JarvisTaskRepository.kt
          grep -Fq 'Yürütülmedi · yürütücü yok' app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt
          grep -Fq 'Yürütülmedi · güvenli yeniden deneme bekliyor' app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt
          echo "VIDEO-COMMAND-TASK-SOURCE-OK"

      - name: Assert exact tr-TR voice policy and engine verification are installed
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/openjarvis/voice/TurkishTtsPolicy.kt
          test -f app/src/main/java/com/openjarvis/voice/AndroidTTSEngine.kt
          test -f app/src/test/java/com/openjarvis/voice/TurkishTtsPolicyTest.kt
          test -f app/src/androidTest/java/com/openjarvis/voice/TurkishTtsEngineInstrumentedTest.kt
          grep -Fq '.filter { isExactTurkishLocale(it.localeTag) }' app/src/main/java/com/openjarvis/voice/TurkishTtsPolicy.kt
          grep -Fq 'TurkishTtsPolicy.exactActualEngineLocale(actualLocaleTag)' app/src/main/java/com/openjarvis/voice/AndroidTTSEngine.kt
          grep -Fq 'TurkishVoiceMissing' app/src/androidTest/java/com/openjarvis/voice/TurkishTtsEngineInstrumentedTest.kt
          grep -Fq 'actualTtsVoiceMustBePresentAndExactlyTurkishAfterSelection' app/src/test/java/com/openjarvis/video/VideoNarrationComposerTest.kt
          grep -Fq 'private const val EXACT_TURKISH_LOCALE_TAG = "tr-TR"' app/src/main/java/com/openjarvis/voice/TurkishTtsPolicy.kt
          grep -Fq 'localeTag.equals(EXACT_TURKISH_LOCALE_TAG, ignoreCase = true)' app/src/main/java/com/openjarvis/voice/TurkishTtsPolicy.kt
          grep -Fq 'exactTrTrRejectsLocaleVariantsExtensionsAndMalformedTags' app/src/test/java/com/openjarvis/voice/TurkishTtsPolicyTest.kt
          grep -Fq 'localeTag.equals(EXACT_TURKISH_LOCALE_TAG, ignoreCase = true)' app/src/main/java/com/openjarvis/voice/TurkishTtsPolicy.kt
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/java/com/openjarvis/voice/TurkishTtsPolicy.kt").read_text()
          start = source.index("fun isExactTurkishLocale(localeTag: String): Boolean {")
          end = source.index("\n    }", start)
          exact_method = source[start:end]
          if "localeTag.equals(EXACT_TURKISH_LOCALE_TAG, ignoreCase = true)" not in exact_method:
              raise SystemExit("Exact tr-TR method does not use direct case-insensitive equality")
          if "Locale.forLanguageTag" in exact_method:
              raise SystemExit("Exact tr-TR method must not parse tolerant BCP-47 input")
          print("STRICT-TR-TR-IMPLEMENTATION-OK")
          PY
          for malformed_tag in "tr-TR-" "tr-TR-u" "tr-TR-u-" "tr-TR-foo!" "tr-TR--x" "tr_TR" " tr-TR" "tr-TR "; do
            grep -Fq "\"$malformed_tag\"" app/src/test/java/com/openjarvis/voice/TurkishTtsPolicyTest.kt || {
              echo "Missing malformed-locale unit regression: $malformed_tag" >&2
              exit 1
            }
            grep -Fq "\"$malformed_tag\"" app/src/androidTest/java/com/openjarvis/video/VideoStoryPipelineInstrumentedTest.kt || {
              echo "Missing malformed-locale actual-engine regression: $malformed_tag" >&2
              exit 1
            }
          done
          grep -Fq 'actualEngineLocaleIsCanonicalExactTrTrOnly' app/src/test/java/com/openjarvis/voice/TurkishTtsPolicyTest.kt
          grep -Fq 'actualEngineVariantLocaleNeverReportsReady' app/src/androidTest/java/com/openjarvis/video/VideoStoryPipelineInstrumentedTest.kt
          echo "EXACT-TR-TR-TTS-SOURCE-OK"

      - name: Assert PR #97/#109/#110/#112/#113/#114 durable task states, Room v7 journal migration, production video executor and null-voice handling
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/openjarvis/tasks/JarvisTaskModel.kt
          test -f app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          test -f app/src/main/java/com/openjarvis/tasks/JarvisTaskDao.kt
          test -f app/src/main/java/com/openjarvis/tasks/JarvisTaskRepository.kt
          test -f app/src/main/java/com/openjarvis/tasks/DeviceActionEventEntity.kt
          test -f app/src/main/java/com/openjarvis/tasks/DeviceActionOutcomeJournal.kt
          test -f app/src/androidTest/java/com/openjarvis/tasks/JarvisTaskMigrationInstrumentedTest.kt
          test -f app/src/androidTest/java/com/openjarvis/tasks/JarvisTaskPersistenceInstrumentedTest.kt
          test -f app/src/androidTest/java/com/openjarvis/tasks/JarvisTaskExecutionSafetyInstrumentedTest.kt
          test -f app/src/androidTest/java/com/openjarvis/tasks/VideoTaskExecutionInstrumentedTest.kt
          test -f app/src/androidTest/java/com/openjarvis/voice/TurkishTtsEngineInstrumentedTest.kt
          grep -Fq 'NOT_EXECUTED("not_executed"' app/src/main/java/com/openjarvis/tasks/JarvisTaskModel.kt
          grep -Fq 'INTERRUPTED("interrupted"' app/src/main/java/com/openjarvis/tasks/JarvisTaskModel.kt
          grep -Fq 'version = 7' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'val MIGRATION_6_7' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'CREATE TABLE IF NOT EXISTS jarvis_device_action_events' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'outcomeJournalReturnsOnlyAfterPrivacySafeRoomCommit' app/src/androidTest/java/com/openjarvis/tasks/JarvisTaskPersistenceInstrumentedTest.kt
          grep -Fq 'versionSixDatabaseMigratesDirectlyToSevenAndPreservesVideoArtifact' app/src/androidTest/java/com/openjarvis/tasks/JarvisTaskMigrationInstrumentedTest.kt
          grep -Fq 'val MIGRATION_3_4' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'val MIGRATION_4_5' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'val MIGRATION_5_6' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq "UPDATE jarvis_tasks SET progressPercent = 0 WHERE status = 'failed'" app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'FAILED("failed", "Başarısız", 0)' app/src/main/java/com/openjarvis/tasks/JarvisTaskModel.kt
          grep -Fq 'JarvisTaskStatus.fromStorage(task.status) == JarvisTaskStatus.SUCCEEDED' app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt
          grep -Fq 'task.progressPercent >= 100' app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt
          grep -Fq 'assertEquals(0, failed.progressPercent)' app/src/androidTest/java/com/openjarvis/tasks/JarvisTaskMigrationInstrumentedTest.kt
          grep -Fq "errorCode = 'EXECUTOR_NOT_CONFIGURED'" app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq "errorCode = 'APP_RESTARTED'" app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'approvalGranted = 0, approvalReference = NULL' app/src/main/java/com/openjarvis/tasks/JarvisTaskDatabase.kt
          grep -Fq 'markNotExecutedIfCurrent' app/src/main/java/com/openjarvis/tasks/JarvisTaskDao.kt
          grep -Fq 'markInterruptedIfCurrent' app/src/main/java/com/openjarvis/tasks/JarvisTaskDao.kt
          grep -Fq 'VideoStoryTaskExecutor(context.applicationContext)' app/src/main/java/com/openjarvis/tasks/JarvisTaskRepository.kt
          grep -Fq 'productionRepositoryRunsRegisteredVideoExecutorAndPersistsVerifiedMediaStoreBundle' app/src/androidTest/java/com/openjarvis/tasks/VideoTaskExecutionInstrumentedTest.kt
          grep -Fq 'nullActualEngineVoiceNeverReportsReadyAndCompletesSttHandoffExactlyOnce' app/src/androidTest/java/com/openjarvis/voice/TurkishTtsEngineInstrumentedTest.kt
          echo "PR97-109-110-DURABLE-TASK-ROOM7-SMS-JOURNAL-VIDEO-PLAYER-DEVICE-HOST-TTS-SOURCE-OK"

      - name: Assert PR #83 retry policy and PR #85 Compose instrumentation are present
        shell: bash
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          grep -Fq 'internal fun shouldOfferRetry(task: JarvisTaskEntity)' app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt
          grep -Fq 'if (taskReviewUiState(task) == TaskReviewUiState.EXECUTOR_UNAVAILABLE) return false' app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt
          grep -Fq 'if (shouldOfferRetry(task))' app/src/main/java/com/openjarvis/ui/dashboard/TaskControlCenter.kt
          grep -Fq 'assertFalse(shouldOfferRetry(task))' app/src/test/java/com/openjarvis/ui/dashboard/TaskControlCenterReviewStateTest.kt
          grep -Fq 'interruptedTaskOffersOnlyAnExplicitManualRetry' app/src/test/java/com/openjarvis/ui/dashboard/TaskControlCenterReviewStateTest.kt
          grep -Fq 'ordinaryNetworkWaitOffersAnExplicitManualRetry' app/src/test/java/com/openjarvis/ui/dashboard/TaskControlCenterReviewStateTest.kt
          echo "PR83-NO-RETRY-WITHOUT-EXECUTOR-SOURCE-OK"

      - name: Assert PR #85 Compose retry instrumentation covers unavailable, interrupted and network-wait states
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          TEST=app/src/androidTest/java/com/openjarvis/ui/dashboard/TaskControlCenterReviewStateInstrumentedTest.kt
          test -f "$TEST"
          grep -Fq 'assertTextAbsent("Yeniden dene")' "$TEST"
          grep -Fq 'fun interruptedTaskShowsAndInvokesExplicitManualRetryAction()' "$TEST"
          grep -Fq 'fun ordinaryNetworkWaitShowsAndInvokesExplicitManualRetryAction()' "$TEST"
          grep -Fq 'composeRule.onNodeWithText("Yeniden dene").assertIsDisplayed().performClick()' "$TEST"
          grep -Fq 'assertTrue("Interrupted task must expose a working manual retry action", retryInvoked)' "$TEST"
          grep -Fq 'assertTrue("Network-wait task must expose a working manual retry action", retryInvoked)' "$TEST"
          echo "PR85-COMPOSE-RETRY-INSTRUMENTATION-SOURCE-OK"

      - name: Audit declared Android permissions (no permission changes)
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'app/src/main/AndroidManifest.xml'
          root = ET.parse(p).getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          declared_permissions = {node.get(ns + 'name') for node in root.findall('uses-permission')}
          print('===== Declared permissions (preserved as approved) =====')
          for permission in sorted(declared_permissions):
              print(permission)
          print('===== Services and foreground-service requirements =====')
          type_permissions = {
              'dataSync': 'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
              'specialUse': 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
          }
          services = root.findall('./application/service')
          errors = []
          for node in services:
              service_name = node.get(ns + 'name')
              service_type = node.get(ns + 'foregroundServiceType', '')
              print(service_name, 'permission=', node.get(ns + 'permission'), 'foregroundServiceType=', service_type)
              if service_type and 'android.permission.FOREGROUND_SERVICE' not in declared_permissions:
                  errors.append(f'{service_name} declares a foreground service but FOREGROUND_SERVICE is missing')
              for service_kind in service_type.split('|'):
                  required = type_permissions.get(service_kind)
                  if required and required not in declared_permissions:
                      errors.append(f'{service_name} declares foregroundServiceType={service_kind}; missing {required} for targetSdk 34 compatibility (Android 14+)')

          download_service = next(
              (node for node in services if (node.get(ns + 'name') or '').endswith('DownloadService')),
              None
          )
          if download_service is None:
              errors.append('DownloadService is missing from the merged manifest')
          elif 'dataSync' not in download_service.get(ns + 'foregroundServiceType', '').split('|'):
              errors.append('DownloadService must declare foregroundServiceType=dataSync')

          queries = root.find('queries')
          launcher_visibility_query = False
          if queries is not None:
              for intent in queries.findall('intent'):
                  actions = {node.get(ns + 'name') for node in intent.findall('action')}
                  categories = {node.get(ns + 'name') for node in intent.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories:
                      launcher_visibility_query = True
                      break
          if not launcher_visibility_query:
              errors.append('Android 11+ launcher package visibility query is missing (MAIN + LAUNCHER)')

          if errors:
              for error in errors:
                  print(f'::error::{error}')
              raise SystemExit(1)
          print('FOREGROUND-SERVICE-MANIFEST-OK')
          print('PACKAGE-VISIBILITY-QUERIES-OK')
          PY

      - name: Validate shell syntax and launcher matcher before Gradle
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/smoke_test.sh
          bash -n scripts/launcher_visibility_check.sh
          bash -n scripts/test_launcher_visibility_check.sh
          bash scripts/test_launcher_visibility_check.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
