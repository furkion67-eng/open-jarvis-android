      - name: Boot Android 13 emulator and run launch smoke scenarios
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_APK: apk/app-debug.apk
          TEST_APK: apk-tests/app-debug-androidTest.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash scripts/smoke_test.sh

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Open-Jarvis-Smoke-Test-Android14
          path: |
            screen-*.png
            crashlog.txt
            logcat-full.txt
            instrumented.log
            databases.txt
            activity-*.txt
            windows-*.txt
            crashlog-*.txt
            logcat-*.txt
            screen-after-instrumented.png
            crashlog-after-instrumented.txt
            logcat-after-instrumented.txt
            activity-after-instrumented.txt
            activity-top-after-instrumented.txt
            windows-after-instrumented.txt
            launcher-start-after-instrumented.txt
            activity-main-activity-visible.txt
            windows-main-activity-visible.txt
            screen-main-activity-visible.png
            crashlog-after-visible-launch.txt
            video-narrated.mp4
            video-narrated.srt
            video-audio-status.txt
            video-contract-test-report.txt
          if-no-files-found: warn
          retention-days: 7

