name: JARVIS exact-source Android validation

on:
  workflow_dispatch:
  push:
    branches: [ "infra/ci-exact-01390d5-20261123" ]
  pull_request:
    branches: [ "feature/startup-coldstart-off-main-20261123" ]

permissions:
  contents: read

concurrency:
  group: jarvis-exact-source-01390d5-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Debug/Release build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifacts_ready: ${{ steps.verify_apk.outcome == 'success' && steps.build_test_apk.outcome == 'success' }}
    steps:
      - name: Checkout exact overlay head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact Feature parent and eight-path Infrastructure allowlist
        env:
          EXPECTED_FEATURE_SHA: 01390d5c6da125e4825261b3388671fe93a2243f
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            test "$EXPECTED_BASE" = "$EXPECTED_FEATURE_SHA"
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          test "$(git merge-base HEAD "$EXPECTED_FEATURE_SHA")" = "$EXPECTED_FEATURE_SHA"
          first_overlay_commit="$(git rev-list --reverse "$EXPECTED_FEATURE_SHA"..HEAD | head -n 1)"
          test -n "$first_overlay_commit"
          test "$(git rev-parse "$first_overlay_commit^")" = "$EXPECTED_FEATURE_SHA"
          # The exact eight-path allowlist is the invariant; review commits may be added without changing product scope.
          expected_paths="$(printf '%s\n' \
            '.github/workflows/build-open-jarvis-apk.yml' \
            'scripts/smoke_test.sh' \
            'scripts/launcher_visibility_check.sh' \
            'scripts/test_launcher_visibility_check.sh' \
            'scripts/test_video_artifact_contract.py' \
            'scripts/validate_video_artifact.py' \
            'ci/overlays/androidTest/java/com/openjarvis/commands/ContactChoicePagingCiOverlayTest.kt' \
            'ci/overlays/androidTest/java/com/openjarvis/video/VideoArtifactEvidenceCiOverlayTest.kt' | LC_ALL=C sort)"
          actual_paths="$(git diff --name-only "$EXPECTED_FEATURE_SHA"...HEAD | LC_ALL=C sort)"
          diff -u <(printf '%s\n' "$expected_paths") <(printf '%s\n' "$actual_paths")
          test "$(printf '%s\n' "$actual_paths" | wc -l | tr -d ' ')" = "8"
          git diff --check "$EXPECTED_FEATURE_SHA"...HEAD
          echo "INFRA-ALLOWLIST-OK: exact Feature parent and exactly eight Infrastructure paths"

      - name: Install ffmpeg and sqlite3
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg sqlite3
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          sqlite3 --version

      - name: Run Infrastructure script self-tests
        run: |
          set -euo pipefail
          bash -n scripts/smoke_test.sh scripts/launcher_visibility_check.sh scripts/test_launcher_visibility_check.sh
          bash scripts/test_launcher_visibility_check.sh
          python3 -m py_compile scripts/test_video_artifact_contract.py scripts/validate_video_artifact.py
          python3 scripts/test_video_artifact_contract.py

      - name: Extract source and install CI-only instrumentation overlays
        id: source
        run: |
          set -euo pipefail
          unzip -q "open-jarvis-apk-build-ready(2).zip" -d source
          SETTINGS_FILE="$(find source -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -d "$PROJECT_DIR/app"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          python3 scripts/repair_sources.py "$PROJECT_DIR"
          python3 scripts/add_startup_diagnostics.py "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/app/src/androidTest/java/com/openjarvis/commands"
          mkdir -p "$PROJECT_DIR/app/src/androidTest/java/com/openjarvis/video"
          cp ci/overlays/androidTest/java/com/openjarvis/commands/ContactChoicePagingCiOverlayTest.kt "$PROJECT_DIR/app/src/androidTest/java/com/openjarvis/commands/"
          cp ci/overlays/androidTest/java/com/openjarvis/video/VideoArtifactEvidenceCiOverlayTest.kt "$PROJECT_DIR/app/src/androidTest/java/com/openjarvis/video/"
          test -s "$PROJECT_DIR/app/src/androidTest/java/com/openjarvis/commands/ContactChoicePagingCiOverlayTest.kt"
          test -s "$PROJECT_DIR/app/src/androidTest/java/com/openjarvis/video/VideoArtifactEvidenceCiOverlayTest.kt"

      - name: Audit declared Android permissions without changing them
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          print('===== Declared permissions (audit only) =====')
          for node in root.findall('uses-permission'):
              print(node.get(ns + 'name'))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platforms and build tools
        run: sdkmanager "platforms;android-33" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Enable AndroidX in extracted project
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          touch gradle.properties
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties

      - name: Build Debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: gradle --no-daemon --max-workers=1 --stacktrace assembleDebug

      - name: Verify Debug APK signature, package metadata and checksum
        id: verify_apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > app/build/outputs/apk/debug/apk-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Build instrumented test APK
        id: build_test_apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: gradle --no-daemon --max-workers=1 --stacktrace assembleDebugAndroidTest

      - name: Run Debug JVM tests independently
        if: always() && steps.source.outcome == 'success'
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: gradle --no-daemon --max-workers=1 --stacktrace testDebugUnitTest

      - name: Run Release JVM tests independently
        if: always() && steps.source.outcome == 'success'
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: gradle --no-daemon --max-workers=1 --stacktrace testReleaseUnitTest

      - name: Upload Debug/Release XML and HTML reports
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Unit-Test-Reports
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/test-results/
            ${{ steps.source.outputs.project_dir }}/app/build/reports/tests/
            video-contract-test-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload instrumented test APK
        if: always() && steps.build_test_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Instrumented-Test-APK
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK and checksum
        if: always() && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    name: Android ${{ matrix.api-level }} instrumentation and evidence
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.outputs.artifacts_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34]
    timeout-minutes: 45
    steps:
      - name: Checkout exact Infrastructure overlay
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: apk

      - name: Download instrumented test APK
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Instrumented-Test-APK
          path: apk-tests

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Boot Android emulator and run acceptance smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_APK: apk/app-debug.apk
          TEST_APK: apk-tests/app-debug-androidTest.apk
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: |
            mkdir -p "$HOME/.android"
            cat > "$HOME/.android/advancedFeatures.ini" <<'EOF'
            Vulkan = off
            GLDirectMem = on
            EOF
            cat "$HOME/.android/advancedFeatures.ini"
          script: bash scripts/smoke_test.sh

      - name: Upload API ${{ matrix.api-level }} screenshots, logs and video review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-API-${{ matrix.api-level }}-Acceptance-Evidence
          path: |
            screen-*.png
            activity-*.txt
            windows-*.txt
            launcher-start*.txt
            processes-*.txt
            input-*.txt
            cpuinfo-*.txt
            meminfo-*.txt
            gfxinfo-*.txt
            lastanr-*.txt
            dropbox-*.txt
            focus-summary-*.txt
            pid-*.txt
            thread-dump-*.txt
            crashlog*.txt
            logcat*.txt
            logcat-full.txt
            instrumented.log
            video-narrated.mp4
            video-narrated.srt
            video-narrated-thumbnail.jpg
            video-narrated-attribution.json
            video-narrated.sha256
            video-audio-status.txt
          if-no-files-found: warn
          retention-days: 14
