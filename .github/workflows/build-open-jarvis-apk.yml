    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Assert exact commit on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected pushed SHA: $GITHUB_SHA"
          echo "Checked out SHA: $actual"
          test "$actual" = "$GITHUB_SHA"

      - name: Validate smoke harness syntax and launcher matcher regression
        run: |
          set -euo pipefail
          for script in scripts/smoke_test.sh scripts/launcher_visibility_check.sh scripts/test_launcher_visibility_check.sh; do
            bash -n "$script"
          done
          bash scripts/test_launcher_visibility_check.sh

      - name: Install ffmpeg for Android 14 video artifact validation
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download app APK
        uses: actions/download-artifact@v8
        with:
          name: Open-Jarvis-APK
          path: apk

      - name: Download instrumented test APK
        uses: actions/download-artifact@v8
        with:
          name: Open-Jarvis-Test-APK
          path: apk-tests

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Ensure sqlite3 is available
        run: |
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y sqlite3
          fi
          sqlite3 --version

      - name: Boot Android 13 emulator and run launch smoke scenarios
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_APK: apk/app-debug.apk
          TEST_APK: apk-tests/app-debug-androidTest.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash scripts/smoke_test.sh

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Open-Jarvis-Smoke-Test-Android14
          path: |
            screen-*.png
            crashlog.txt
            logcat-full.txt
            instrumented.log
            databases.txt
            activity-*.txt
            windows-*.txt
            crashlog-*.txt
            logcat-*.txt
            screen-after-instrumented.png
            crashlog-after-instrumented.txt
            logcat-after-instrumented.txt
            activity-after-instrumented.txt
            activity-top-after-instrumented.txt
            windows-after-instrumented.txt
            launcher-start-after-instrumented.txt
            activity-main-activity-visible.txt
            windows-main-activity-visible.txt
            screen-main-activity-visible.png
            crashlog-after-visible-launch.txt
            video-storyboard-preview.mp4
            video-storyboard-preview.srt
            video-contract-test-report.txt
          if-no-files-found: warn
          retention-days: 7

