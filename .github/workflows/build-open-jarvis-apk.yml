name: Build Open Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [ main, "feature/approval-toggle" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source and locate project
        id: source
        run: |
          unzip -q "open-jarvis-apk-build-ready(2).zip" -d source
          SETTINGS_FILE="$(find source -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -d "$PROJECT_DIR/app"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"
          python3 scripts/repair_sources.py "$PROJECT_DIR"
          # Guard the actual launcher database path. MainActivity and DashboardScreen
          # both queried Room during startup without handling migration/open errors.
          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          main = root / "app/src/main/java/com/openjarvis/ui/MainActivity.kt"
          s = main.read_text()
          s = s.replace("    private lateinit var graphifyRepo: GraphifyRepository\n", "")
          old_init = "        graphifyRepo = GraphifyRepository(this)"
          if old_init not in s:
              raise SystemExit("Expected GraphifyRepository initialization not found in MainActivity.kt")
          s = s.replace(old_init, """        val graphifyRepo = try {
              GraphifyRepository(applicationContext)
          } catch (e: Exception) {
              android.util.Log.e("OpenJarvis", "Graphify database initialization failed", e)
              null
          }""")
          old_state = """                var recentTasks by remember { mutableStateOf<List<TaskNode>>(emptyList()) }
                
                LaunchedEffect(Unit) {
                    recentTasks = graphifyRepo.getRecentTasks(10)
                }
"""
          if old_state not in s:
              raise SystemExit("Expected unguarded MainActivity database query not found")
          s = s.replace(old_state, "")
          s = s.replace("import com.openjarvis.graphify.nodes.TaskNode\n", "")
          main.write_text(s)

          dashboard = root / "app/src/main/java/com/openjarvis/ui/dashboard/DashboardScreen.kt"
          ds = dashboard.read_text()
          ds = ds.replace("    graphifyRepo: GraphifyRepository,", "    graphifyRepo: GraphifyRepository?,")
          old_query = """    LaunchedEffect(Unit) {
        recentTasks = graphifyRepo.getRecentTasks(10)
        mostUsedApps = graphifyRepo.getMostUsedApps(4)
    }"""
          if old_query not in ds:
              raise SystemExit("Expected unguarded DashboardScreen database query not found")
          ds = ds.replace(old_query, """    LaunchedEffect(graphifyRepo) {
        val repository = graphifyRepo ?: return@LaunchedEffect
        try {
            recentTasks = repository.getRecentTasks(10)
            mostUsedApps = repository.getMostUsedApps(4)
        } catch (e: Exception) {
            android.util.Log.e("OpenJarvis", "Dashboard database load failed", e)
        }
    }""")
          ds = ds.replace(
              "            HeroSection(isSystemActive = isSystemActive)",
              """            HeroSection(isSystemActive = isSystemActive)

            if (graphifyRepo == null) {
                Text(
                    text = "Yerel hafıza veritabanı açılamadı. Ana ekran çalışıyor; hafıza verileri geçici olarak kullanılamıyor.",
                    color = VoidColor.TextSecondary,
                    style = MaterialTheme.typography.bodySmall,
                    modifier = Modifier.padding(top = 12.dp)
                )
            }"""
          )
          dashboard.write_text(ds)
          PY
          ls -la "$PROJECT_DIR"

      - name: Audit declared Android permissions (no permission changes)
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'app/src/main/AndroidManifest.xml'
          root = ET.parse(p).getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          print('===== Declared permissions (preserved as approved) =====')
          for node in root.findall('uses-permission'):
              print(node.get(ns + 'name'))
          print('===== Services and protection =====')
          for node in root.findall('./application/service'):
              print(node.get(ns + 'name'), 'permission=', node.get(ns + 'permission'))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Enable AndroidX
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          touch gradle.properties
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          cat gradle.properties

      - name: Capture failing Kotlin source context
        if: always()
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          echo "===== AgentCore.kt ====="
          sed -n '285,330p' app/src/main/java/com/openjarvis/agent/AgentCore.kt || true
          echo "===== MCPClient.kt ====="
          sed -n '1,155p' app/src/main/java/com/openjarvis/mcp/MCPClient.kt || true
          echo "===== AutomationManager.kt ====="
          sed -n '180,235p' app/src/main/java/com/openjarvis/automation/AutomationManager.kt || true
          echo "===== AutomationDB.kt ====="
          sed -n '1,100p' app/src/main/java/com/openjarvis/automation/AutomationDB.kt || true
          echo "===== TaskNodeDao.kt ====="
          sed -n '1,80p' app/src/main/java/com/openjarvis/graphify/nodes/TaskNodeDao.kt || true

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: gradle --no-daemon --max-workers=1 --stacktrace assembleDebug

      - name: Package patched source for diagnostics
        if: always()
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          zip -qr "$GITHUB_WORKSPACE/open-jarvis-patched-source.zip" . -x '*/build/*' '*/.gradle/*'

      - name: Upload patched source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Source-Debug
          path: open-jarvis-patched-source.zip
          if-no-files-found: warn
          retention-days: 2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-APK
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
