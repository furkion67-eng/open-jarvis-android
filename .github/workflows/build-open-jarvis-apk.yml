          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: Enable AndroidX
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          touch gradle.properties
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          cat gradle.properties

      - name: Capture failing Kotlin source context
        if: always()
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          echo "===== AgentCore.kt ====="
          sed -n '285,330p' app/src/main/java/com/openjarvis/agent/AgentCore.kt || true
          echo "===== MCPClient.kt ====="
          sed -n '1,155p' app/src/main/java/com/openjarvis/mcp/MCPClient.kt || true
          echo "===== AutomationManager.kt ====="
          sed -n '180,235p' app/src/main/java/com/openjarvis/automation/AutomationManager.kt || true
          echo "===== AutomationDB.kt ====="
          sed -n '1,100p' app/src/main/java/com/openjarvis/automation/AutomationDB.kt || true
          echo "===== TaskNodeDao.kt ====="
          sed -n '1,80p' app/src/main/java/com/openjarvis/graphify/nodes/TaskNodeDao.kt || true

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/gradle-assembleDebug-$attempt.log"
            if gradle --no-daemon --max-workers=1 --stacktrace assembleDebug 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -Eq "Plugin \\[id: 'com\\.google\\.devtools\\.ksp'.*was not found|Could not resolve plugin artifact 'com\\.google\\.devtools\\.ksp" "$log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Transient KSP plugin resolution failure (attempt $attempt/3); retrying"
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Run debug and release JVM tests, build test APK and release APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1
        run: gradle --no-daemon --max-workers=1 --stacktrace testDebugUnitTest testReleaseUnitTest assembleDebugAndroidTest assembleRelease
      - name: Assert security, narrated video, CREATE_VIDEO routing and task recovery unit tests ran in Debug and Release
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          for variant in Debug Release; do
            python3 - "$variant" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          variant = sys.argv[1]
          root = pathlib.Path("app/build/test-results") / ("test" + variant + "UnitTest")
          requirements = {
              "ProviderLogRedactionTest": {
                  "capturedHttpLogsExcludeSecretsUrlsHeadersPromptsAndResponses",
                  "mcpHttpClientUsesTheSameRedactedLoggingPolicy",
                  "geminiGenerateContentUsesHeaderAndNeverPlacesKeyInUrlOrBody",
                  "geminiListModelsUsesHeaderAndNeverPlacesKeyInUrl",
              },
              "VideoStoryPlanTest": {
                  "istanbulConquestCreatesFiveSourceBackedScenesAndFortyFiveSecondDraft",
                  "everySceneHasDistinctSourceBackedVisualAndClaim",
                  "captionsAreMonotonicAndSrtUsesTurkishText",
                  "unsupportedTopicFailsClosedInsteadOfUsingGenericFiller",
                  "speechFrameBoundariesSelectTheMatchingVisualScene",
                  "blankPromptIsRejected",
              },
              "VideoNarrationComposerTest": {
                  "pcmWavReaderCalculatesOneSecondMonoDuration",
                  "pcmWavReaderRejectsNonPcmEncoding",
                  "captionsFollowActualPerSceneSpeechDurations",
                  "sceneFrameDurationsFollowMeasuredSpeechWithOnlyShortVisualHold",
                  "sceneFrameDurationsRejectEmptyOrInvalidSpeechTimeline",
                  "finalCaptionDoesNotCoverPaddedSilentVideoTail",
                  "captionTextIncludesTheHeadingThatTtsActuallySpeaks",
                  "narrationLongerThanRenderedVideoIsRejected",
              },
              "VideoCommandRouterTest": {
                  "typedAndRecognizedSpeechResolveTheSameTurkishTopic",
                  "acceptsTurkishInflectionAndVideoFirstOrder",
                  "stripsTrailingPunctuationAndPoliteTurkishVerbForms",
                  "videoCommandWithoutTopicRequestsMoreInformation",
                  "ordinaryConversationAboutVideoIsNotACommand",
                  "typedAndSpeechRequestsShareStableKeyWithinDedupWindow",
                  "sameTopicCanBeRequestedAgainAfterDedupWindow",
                  "differentTopicsNeverShareRequestKeyInSameWindow",
                  "blankTopicCannotProduceRequestKey",
                  "canonicalTaskGoalCanBeResolvedAgainByExecutor",
              },
              "TaskControlCenterReviewStateTest": {
                  "unacceptedPlanShowsOnlyPlanReviewAction",
                  "acceptedPlanWithMissingExternalApprovalShowsSeparateApprovalState",
                  "acceptedPlanAwaitingExternalApprovalShowsNoSyntheticProgress",
                  "unacceptedExternalPlanShowsNoExecutionProgressOrPercent",
                  "configuredExecutorMissingIsNotPresentedAsRetryableExecution",
                  "interruptedTaskOffersOnlyAnExplicitManualRetry",
                  "ordinaryNetworkWaitOffersAnExplicitManualRetry",
                  "localPlanPreviewNeverClaimsDeterminateExecutionProgress",
                  "activeVideoRenderUsesIndeterminateProgressWithoutSyntheticPercent",
                  "interruptedVideoTaskShowsNoSyntheticProgress",
                  "interruptedExternalTaskDoesNotShowStaleDeterminateProgress",
                  "videoPreviewDoesNotShowExecutionProgressBeforePlanAcceptance",
                  "legacyWaitingTaskWithoutReviewCheckpointCannotBeAcceptedAgain",
                  "failedExternalTaskDoesNotShowSyntheticCompletionPercentOrProgressBar",
                  "failedVideoTaskShowsFailureWithoutCompletionPercentOrProgressBar",
                  "cancelledTaskDoesNotShowProgressOrCompletionPercent",
              },
              "VideoTaskArtifactKeyTest": {
                  "sameDurableRequestKeyProducesSameOpaqueArtifactToken",
                  "differentRequestKeysProduceDifferentArtifactTokens",
              },
              "StorageAccessContractTest": {
                  "deletionRequiresSameUriAndExactUnchangedName",
              },
              "CapabilityStatusPolicyTest": {
                  "permissionHistoryDistinguishesNeverRequestedDeniedAndRevoked",
                  "persistedUriMustStillHaveReadGrant",
              },
              "StorageScopePolicyTest": {
                  "samePersistedTreeAllowsRead",
                  "differentAuthorityOrTreeIsRejected",
                  "missingReadGrantIsRejected",
                  "writeRequiresWriteGrant",
                  "missingTreeUriIsRejected",
              },
              "StorageUriGrantPolicyTest": {
                  "onlyPickerReturnedReadWriteFlagsArePersisted",
                  "processRestartRestoreRequiresMatchingLiveReadGrant",
              },
              "StorageMutationPolicyTest": {
                  "renameRequiresExactUnchangedSourceAndPreviewedNewName",
                  "copyAndMoveRequireExactSourceAndDestinationPreview",
                  "transferCannotTargetTheSourceDocumentItself",
              },
              "ContactResolutionTest": {
                  "uniqueTurkishNameResolvesContactAndNumberWithoutManualInput",
                  "multipleContactsRequireExplicitChoice",
                  "oneContactWithMultipleNumbersRequiresNumberChoice",
                  "noMatchIsExplicit",
                  "blankQueryIsRejected",
                  "deniedPermissionNeverQueriesProvider",
                  "revokedPermissionDuringQueryIsReportedAsDenied",
              },
              "SmsActionContractTest": {
                  "messageCannotBeConsumedBeforeExplicitConfirmation",
                  "confirmationIsSingleUse",
                  "forgedTokenCannotConsumeLegitimateConfirmation",
                  "deniedPermissionCancelsConfirmationAndNeverCallsTransport",
                  "sentRequiresSuccessfulCallbackForEveryPart",
                  "failedPartCanNeverBecomeSent",
                  "missingCallbackIsUnknownNotSent",
                  "invalidPhoneAndEmptyMessageCannotCreateReview",
              },
              "JarvisTaskStateMachineTest": {
                  "nonExecutionAndInterruptionAreDurableRetryableStates",
              },
              "TurkishTtsPolicyTest": {
                  "exactTrTrOfflineVoiceWinsOverHigherQualityOtherRegion",
                  "offlineWinsWhenExactLocaleAndQualityAreEqual",
                  "nonTurkishVoicesAreNeverSelected",
                  "genericAndOtherRegionTurkishVoicesAreRejectedWithoutExactTrTr",
                  "unsupportedLanguageAvailabilityIsRejected",
                  "missingVoiceMessageIsActionableAndTurkish",
                  "initializationFailureMessageIsTurkishAndActionable",
                  "recognizesAndroidNetworkSynthesisFeatureNames",
                  "stopDrainsPendingHandoffsExactlyOnce",
                  "replacingAnUtteranceDiscardsOnlyTheOlderHandoff",
                  "releaseDiscardsPendingHandoffsWithoutInvokingThem",
                  "nullOrNonExactActualEngineVoiceNeverProducesReadyLocale",
                  "exactTrTrRejectsLocaleVariantsExtensionsAndMalformedTags",
                  "actualEngineLocaleIsCanonicalExactTrTrOnly",
              },
          }
          for class_name, required in requirements.items():
              reports = list(root.rglob("*" + class_name + "*.xml"))
              if not reports:
                  raise SystemExit(f"{variant}: missing XML report for {class_name}")
              report = ET.parse(reports[0]).getroot()
              tests = int(report.attrib.get("tests", "0"))
              failures = int(report.attrib.get("failures", "0"))
              errors = int(report.attrib.get("errors", "0"))
              skipped = int(report.attrib.get("skipped", "0"))
              names = {node.attrib.get("name", "") for node in report.iter("testcase")}
              missing = sorted(required - names)
              if tests < len(required) or failures or errors or skipped or missing:
                  raise SystemExit(f"{variant} {class_name}: tests={tests}, failures={failures}, errors={errors}, skipped={skipped}, missing={missing}")
