name: Open Jarvis APK Build

on:
  push:
    branches:
      - jarvis/apk-build-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: Extract project archive
        run: |
          mkdir -p source
          unzip -q "open-jarvis-apk-build-ready(2).zip" -d source
          test -d source/open-jarvis-main/app

      - name: Apply source compatibility repairs
        run: |
          python3 scripts/repair_sources.py source/open-jarvis-main
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\norg.gradle.parallel=true\n' > source/open-jarvis-main/gradle.properties

      - name: Build debug APK
        working-directory: source/open-jarvis-main
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          test -s source/open-jarvis-main/app/build/outputs/apk/debug/app-debug.apk
          ls -lh source/open-jarvis-main/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-APK-debug
          path: source/open-jarvis-main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
